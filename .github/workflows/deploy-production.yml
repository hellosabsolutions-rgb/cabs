name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'server/**'
      - 'scripts/thanos/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy admin + server'
        type: boolean
        default: true

concurrency:
  group: kabpro-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & publish on THANOS
    runs-on: [self-hosted, thanos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            server/package-lock.json

      - name: Build admin dashboard
        working-directory: admin
        env:
          VITE_API_URL: https://api-kabpro.opsiva.in/api
          VITE_SOCKET_URL: https://api-kabpro.opsiva.in
          VITE_APP_URL: https://admin-kabpro.opsiva.in
          VITE_LANDING_URL: https://kabpro.opsiva.in
          # Also loaded from admin/.env.production (Google + Firebase public client keys)
        run: |
          npm ci --include=dev
          npm run build
          echo "==> Admin build output"
          du -sh dist/assets 2>/dev/null || true
          ls -la dist/assets/*.js 2>/dev/null | head -10 || true

      - name: Publish to /srv/apps/cabs
        env:
          REPO_ROOT: /srv/apps/cabs
        run: |
          chmod +x scripts/thanos/publish-from-ci.sh
          bash scripts/thanos/publish-from-ci.sh

      - name: Smoke test API
        env:
          REPO_ROOT: /srv/apps/cabs
        run: |
          set -euo pipefail
          ENV_FILE="${REPO_ROOT}/server/.env.production"
          PORT=""
          if [[ -f "${ENV_FILE}" ]]; then
            PORT="$(grep -E '^PORT=' "${ENV_FILE}" | head -1 | cut -d= -f2- | tr -d ' \r\"' || true)"
          fi
          PORT="${PORT:-5002}"

          echo "==> Smoke: direct API http://127.0.0.1:${PORT}/api/health"
          BODY=""
          OK=0
          for i in $(seq 1 20); do
            BODY="$(curl -sS "http://127.0.0.1:${PORT}/api/health" || true)"
            if echo "${BODY}" | grep -q '"status":"online"'; then
              echo "${BODY}"
              OK=1
              break
            fi
            echo "  attempt ${i}: not ready yet — ${BODY:-no response}"
            sleep 2
          done
          if [[ "${OK}" -ne 1 ]]; then
            echo "ERROR: direct health check failed"
            pm2 describe kabpro-api 2>/dev/null || true
            pm2 logs kabpro-api --lines 40 --nostream 2>/dev/null || true
            ss -tlnp | grep -E ":${PORT}\\b" || true
            exit 1
          fi

          echo "==> Smoke: nginx Host api-kabpro.opsiva.in"
          NGX="$(curl -sS -H "Host: api-kabpro.opsiva.in" http://127.0.0.1/api/health || true)"
          echo "${NGX}"
          echo "${NGX}" | grep -q '"status":"online"'

          echo "==> Smoke: public https://api-kabpro.opsiva.in/api/health"
          PUB="$(curl -sS --max-time 15 https://api-kabpro.opsiva.in/api/health || true)"
          echo "${PUB}"
          if ! echo "${PUB}" | grep -q '"status":"online"'; then
            echo "WARN: public URL check failed (tunnel/DNS) — local checks passed"
          fi

          echo "==> Smoke OK"
