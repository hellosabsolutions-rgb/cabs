# KABPRO production nginx — THANOS (127.0.0.1:80, Cloudflare Tunnel in front)
# Install:
#   sudo cp scripts/thanos/nginx-kabpro-production.conf /etc/nginx/sites-available/kabpro-production
#   sudo ln -sf /etc/nginx/sites-available/kabpro-production /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Primary domain: kabpro.pro
# Legacy opsiva.in hostnames kept for cutover (remove later).
#
# Port 5002: Opsiva BACKEND already uses 5000–5005, 8080 on this host.
# Must match PORT in server/.env.production and nginx proxy_pass below.

include /etc/nginx/snippets/proxy-headers.conf;

# API + Socket.IO  →  https://api.kabpro.pro
server {
  listen 127.0.0.1:80;
  listen [::1]:80;
  server_name api.kabpro.pro api-kabpro.opsiva.in;

  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:5002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }
}

# Admin dashboard  →  https://admin.kabpro.pro
server {
  listen 127.0.0.1:80;
  listen [::1]:80;
  server_name admin.kabpro.pro admin-kabpro.opsiva.in;

  root /srv/apps/cabs/admin/dist;
  index index.html;

  # Hashed assets — long cache (safe; filename changes every build)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA shell — never cache index.html (prevents stale vendor/react chunk mismatch after deploy)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

# Landing (Next.js)  →  https://kabpro.pro
server {
  listen 127.0.0.1:80;
  listen [::1]:80;
  server_name kabpro.pro www.kabpro.pro kabpro.opsiva.in;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
