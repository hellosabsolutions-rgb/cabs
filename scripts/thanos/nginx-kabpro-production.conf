# KABPRO production nginx — THANOS (127.0.0.1:80, Cloudflare Tunnel in front)
# Install:
#   sudo cp scripts/thanos/nginx-kabpro-production.conf /etc/nginx/sites-available/kabpro-production
#   sudo ln -sf /etc/nginx/sites-available/kabpro-production /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Port 5002: Opsiva BACKEND already uses 5000–5005, 8080 on this host.
# Must match PORT in server/.env.production and nginx proxy_pass below.

include /etc/nginx/snippets/proxy-headers.conf;

# API + Socket.IO  →  https://api-kabpro.opsiva.in
server {
  listen 127.0.0.1:80;
  listen [::1]:80;
  server_name api-kabpro.opsiva.in;

  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:5002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }
}

# Admin dashboard  →  https://admin-kabpro.opsiva.in
server {
  listen 127.0.0.1:80;
  listen [::1]:80;
  server_name admin-kabpro.opsiva.in;

  root /srv/apps/cabs/admin/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Landing (Next.js)  →  https://kabpro.opsiva.in
server {
  listen 127.0.0.1:80;
  listen [::1]:80;
  server_name kabpro.opsiva.in;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
